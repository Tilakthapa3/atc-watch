name: Update ATC status

# Refresh data/status.json every 15 minutes so the dashboard at
# tilakthapa.com/atc-watch.html stays current. The snapshot is
# committed only when it changed.
#
# NOTE: workflow files cannot be pushed through the GitHub API, so
# this file is added to the repo through the GitHub website.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Export status snapshot
        run: python3 export_snapshot.py

      - name: Commit snapshot if changed
        run: |
          git config user.name "ATC Watch"
          git config user.email "atc-watch@tilakthapa.com"
          git add data/status.json
          git diff --cached --quiet || git commit -m "Update ATC status snapshot"
          git push
